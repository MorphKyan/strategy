# ==============================================================================
# 策略配置说明 / STRATEGY CONFIGURATION SPECIFICATION (v2 升级版)
# 策略名称: 预期短缺风险平价 + 200 SMA 阶梯式趋势过滤 (1000k v2 - 有色替代能化)
# 策略定位: 252d FHS 预期短缺风险预算 + 200 SMA 阶梯降仓 (跌破均线保留 25% 底仓，75% 切入现金)
# 资产宇宙: 股票(沪深300+红利) + 超长国债(30Y) + 黄金 + 大宗商品(农产品豆粕 + 工业金属有色)
# 升级说明: v2 版本使用 159980 (有色期货ETF) 替代 159981 (能化ETF)，消除 Contango 展期磨损
# 资金规模: 1,000,000 元
# ==============================================================================

platform:
  run_name: es_252d_fhs_stepdown_trend_1000k_v2

data:
  data_dir: data

assets:
  - asset_id: CN_ETF:510300.SH
    code: '510300'
    name: 沪深300ETF
    asset_type: etf
    exchange: SH
    currency: CNY
    lot_size: 100
    price_limit_pct: 0.1
  - asset_id: CN_ETF:512890.SH
    code: '512890'
    name: 红利低波ETF
    asset_type: etf
    exchange: SH
    currency: CNY
    lot_size: 100
    price_limit_pct: 0.1
  - asset_id: CN_ETF:518880.SH
    code: '518880'
    name: 黄金ETF
    asset_type: etf
    exchange: SH
    currency: CNY
    lot_size: 100
    price_limit_pct: 0.1
  - asset_id: CN_ETF:511090.SH
    code: '511090'
    name: 30年国债ETF 511090
    asset_type: etf
    exchange: SH
    currency: CNY
    lot_size: 100
    price_limit_pct: 0.1
  - asset_id: CN_ETF:159985.SZ
    code: '159985'
    name: 豆粕ETF
    asset_type: etf
    exchange: SZ
    currency: CNY
    lot_size: 100
    price_limit_pct: 0.1
  - asset_id: CN_ETF:159980.SZ
    code: '159980'
    name: 有色期货ETF
    asset_type: etf
    exchange: SZ
    currency: CNY
    lot_size: 100
    price_limit_pct: 0.1

portfolio:
  initial_cash: 1000000.0
  initial_equity: 1000000.0
  initial_positions: []

backtest:
  enable_checkpoints: false

execution:
  round_mode: round
  weight_tolerance: 0.02
  unfilled_policy: retry_next_day
  fee:
    rate: 0.0002
    min_fee: 5.0

output:
  results_dir: results/temporary_backtests/direct

strategy:
  strategy_name: risk_parity_expected_shortfall_fixed_budget
  strategy_version_id: null
  cancel_pending_on_start: false
  params:
    # --- 调仓与样本窗口参数 ---
    rebalance_frequency: monthly       # 调仓频率: 每月末定期待分配
    rolling_window: 252                # ES 风险估计滚动窗口 (252 交易日)
    min_periods: 252                   # 策略预热门槛周期
    rebalance_threshold: 0.05          # 换手容忍偏离度阈值 (5%)

    # --- 预期短缺 (Expected Shortfall / CVaR) 风险模型 ---
    confidence_level: 0.95            # ES 尾部置信度 (95% 极端损失均值)
    volatility_target: 0.08           # 组合整体年化目标波动率 (8%)
    es_method: filtered               # 算法内核: filtered (FHS 滤波历史模拟)
    fhs_decay: 0.94

    # --- 资产固定风险预算分布 (Fixed Risk Budgets) ---
    risk_budgets:
      CN_ETF:510300.SH: 0.15     # 沪深300 风险预算 15%
      CN_ETF:512890.SH: 0.15     # 红利低波 风险预算 15%
      CN_ETF:511090.SH: 0.30     # 30年超长国债 风险预算 30% (内生杠杆提高资金利用率)
      CN_ETF:518880.SH: 0.15     # 黄金资产 风险预算 15% (抗通胀与地缘避险)
      CN_ETF:159985.SZ: 0.125    # 豆粕资产 风险预算 12.5% (农产品周期对冲)
      CN_ETF:159980.SZ: 0.125    # 有色金属资产 风险预算 12.5% (工业金属资源供给刚性)

    universe:
      - CN_ETF:510300.SH
      - CN_ETF:512890.SH
      - CN_ETF:511090.SH
      - CN_ETF:518880.SH
      - CN_ETF:159985.SZ
      - CN_ETF:159980.SZ

    # --- 趋势跟踪过滤器 (Trend Following Filter - 阶梯式降仓实战版) ---
    trend_filter_window: 200          # 趋势均线窗口: 200 交易日 (10-Month SMA)
    trend_filter_type: sma            # 均线类型: 简单移动平均线 (SMA)
    trend_filter_mode: binary         # 过滤模式: binary (阶梯降仓)
    trend_filter_scale_down: 0.25     # 破位保留比例: 0.25 (跌破均线保留 25% 票息底仓，75% 资金切入现金)
