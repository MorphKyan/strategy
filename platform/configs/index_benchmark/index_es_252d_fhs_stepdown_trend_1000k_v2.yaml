# ==============================================================================
# 策略配置说明 / STRATEGY CONFIGURATION SPECIFICATION (v2 指数研究版)
# 策略名称: 预期短缺风险平价 + 200 SMA 阶梯式趋势过滤 (指数研究 1000k v2 - 沪铜CU0替代TA0)
# 策略定位: 252d FHS 预期短缺风险预算 + 200 SMA 阶梯降仓 (13年大类资产指数/连续合约超长回测)
# 资产宇宙: 股票(沪深300+上证红利) + 超长国债(中债30Y) + 黄金 + 大宗商品(豆粕M0 + 沪铜CU0)
# 升级说明: v2 版本使用 CU0 (沪铜期货连续) 替代 TA0 (能化PTA)，体现工业金属长期供给刚性
# 资金规模: 1,000,000 元 (研究基准标准规模，完美消除期货单手大点位截断误差)
# ==============================================================================

platform:
  run_name: index_es_252d_fhs_stepdown_trend_1000k_v2

data:
  data_dir: data

assets:
  - asset_id: CN_INDEX:000300.SH
    code: '000300'
    name: 沪深300指数
    asset_type: index
    exchange: SH
    currency: CNY
    lot_size: 1
    price_limit_pct: 0.1
  - asset_id: CN_INDEX:000015.SH
    code: '000015'
    name: 上证红利指数
    asset_type: index
    exchange: SH
    currency: CNY
    lot_size: 1
    price_limit_pct: 0.1
  - asset_id: CN_INDEX:CBA21801.CS
    code: CBA21801
    name: 中债30年国债财富指数
    asset_type: index
    exchange: CS
    currency: CNY
    lot_size: 1
    price_limit_pct: 0.1
  - asset_id: CN_ETF:518880.SH
    code: '518880'
    name: 黄金现货/ETF
    asset_type: etf
    exchange: SH
    currency: CNY
    lot_size: 100
    price_limit_pct: 0.1
  - asset_id: CN_FUTURES:M0.DCE
    code: M0
    name: 豆粕期货主力连续
    asset_type: futures
    exchange: DCE
    currency: CNY
    lot_size: 1
    price_limit_pct: 0.1
  - asset_id: CN_FUTURES:CU0.SHFE
    code: CU0
    name: 沪铜期货主力连续
    asset_type: futures
    exchange: SHFE
    currency: CNY
    lot_size: 1
    price_limit_pct: 0.1

portfolio:
  initial_cash: 1000000.0
  initial_equity: 1000000.0
  initial_positions: []

backtest:
  enable_checkpoints: false

execution:
  round_mode: round
  weight_tolerance: 0.02
  unfilled_policy: retry_next_day
  fee:
    rate: 0.0002
    min_fee: 5.0

output:
  results_dir: results/temporary_backtests/direct

strategy:
  strategy_name: risk_parity_expected_shortfall_fixed_budget
  strategy_version_id: null
  cancel_pending_on_start: false
  params:
    rebalance_frequency: monthly
    rolling_window: 252
    min_periods: 252
    rebalance_threshold: 0.05
    confidence_level: 0.95
    volatility_target: 0.08
    es_method: filtered
    fhs_decay: 0.94
    risk_budgets:
      CN_INDEX:000300.SH: 0.15
      CN_INDEX:000015.SH: 0.15
      CN_INDEX:CBA21801.CS: 0.30
      CN_ETF:518880.SH: 0.15
      CN_FUTURES:M0.DCE: 0.125
      CN_FUTURES:CU0.SHFE: 0.125
    universe:
      - CN_INDEX:000300.SH
      - CN_INDEX:000015.SH
      - CN_INDEX:CBA21801.CS
      - CN_ETF:518880.SH
      - CN_FUTURES:M0.DCE
      - CN_FUTURES:CU0.SHFE
    trend_filter_window: 200
    trend_filter_type: sma
    trend_filter_mode: binary
    trend_filter_scale_down: 0.25
