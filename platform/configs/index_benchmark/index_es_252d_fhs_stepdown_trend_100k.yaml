# ==============================================================================
# 策略配置说明 / STRATEGY CONFIGURATION SPECIFICATION
# 策略名称: 13年跨周期大类资产指数 + 200 SMA 阶梯式降仓
# 策略定位: 方案 B 指数标的 13 年跨周期 252d FHS 预期短缺风险预算 + 200 SMA 阶梯降仓 (跌破均线保留 25% 底仓)
# 资产宇宙: 股票(沪深300+红利) + 超长国债(30Y) + 黄金 + 大宗商品(农产品+能化)
# 资金规模: 100,000 元
# ==============================================================================

platform:
  run_name: index_es_252d_fhs_stepdown_trend_100k

data:
  data_dir: data

assets:
  - asset_id: CN_INDEX:000300.SH
    code: '000300'
    name: 沪深300指数
    asset_type: index
    exchange: SH
    currency: CNY
    lot_size: 1
    price_limit_pct: 0.1
  - asset_id: CN_INDEX:000015.SH
    code: '000015'
    name: 上证红利指数
    asset_type: index
    exchange: SH
    currency: CNY
    lot_size: 1
    price_limit_pct: 0.1
  - asset_id: CN_INDEX:CBA21801.CS
    code: CBA21801
    name: 中债30年国债财富指数
    asset_type: index
    exchange: CS
    currency: CNY
    lot_size: 1
    price_limit_pct: 0.1
  - asset_id: CN_ETF:518880.SH
    code: '518880'
    name: 黄金现货/ETF
    asset_type: etf
    exchange: SH
    currency: CNY
    lot_size: 100
    price_limit_pct: 0.1
  - asset_id: CN_FUTURES:M0.DCE
    code: M0
    name: 豆粕期货主力连续
    asset_type: futures
    exchange: DCE
    currency: CNY
    lot_size: 1
    price_limit_pct: 0.1
  - asset_id: CN_FUTURES:TA0.CZCE
    code: TA0
    name: PTA能化期货主力连续
    asset_type: futures
    exchange: CZCE
    currency: CNY
    lot_size: 1
    price_limit_pct: 0.1

portfolio:
  initial_cash: 100000.0
  initial_equity: 100000.0
  initial_positions: []

backtest:
  enable_checkpoints: false

execution:
  round_mode: round
  weight_tolerance: 0.02
  unfilled_policy: retry_next_day
  fee:
    rate: 0.0002
    min_fee: 5.0

output:
  results_dir: results/temporary_backtests/direct

strategy:
  strategy_name: risk_parity_expected_shortfall_fixed_budget
  strategy_version_id: null
  cancel_pending_on_start: false
  params:
    # --- 调仓与样本窗口参数 ---
    rebalance_frequency: monthly       # 调仓频率: 每月末定期待分配
    rolling_window: 252                # ES 风险估计滚动窗口 (252 交易日)
    min_periods: 252                   # 策略预热门槛周期
    rebalance_threshold: 0.05          # 换手容忍偏离度阈值 (5%)

    # --- 预期短缺 (Expected Shortfall / CVaR) 风险模型 ---
    confidence_level: 0.95            # ES 尾部置信度 (95% 极端损失均值)
    volatility_target: 0.08           # 组合整体年化目标波动率 (8%)
    es_method: filtered               # 算法内核: filtered (FHS 滤波历史模拟)
    fhs_decay: 0.94

    # --- 资产固定风险预算分布 (Fixed Risk Budgets) ---
    risk_budgets:
      CN_INDEX:000300.SH: 0.15     # 沪深300 风险预算 15%
      CN_INDEX:000015.SH: 0.15     # 红利低波 风险预算 15%
      CN_INDEX:CBA21801.CS: 0.30     # 30年超长国债 风险预算 30% (内生杠杆提高资金利用率)
      CN_ETF:518880.SH: 0.15          # 黄金资产 风险预算 15% (抗通胀与地缘避险)
      CN_FUTURES:M0.DCE: 0.125    # 豆粕资产 风险预算 12.5% (农产品周期对冲)
      CN_FUTURES:TA0.CZCE: 0.125   # 能化资产 风险预算 12.5% (工业周期对冲)

    universe:
      - CN_INDEX:000300.SH
      - CN_INDEX:000015.SH
      - CN_INDEX:CBA21801.CS
      - CN_ETF:518880.SH
      - CN_FUTURES:M0.DCE
      - CN_FUTURES:TA0.CZCE
    # --- 趋势跟踪过滤器 (阶梯降仓实战版) ---
    trend_filter_window: 200
    trend_filter_type: sma
    trend_filter_mode: binary
    trend_filter_scale_down: 0.25
