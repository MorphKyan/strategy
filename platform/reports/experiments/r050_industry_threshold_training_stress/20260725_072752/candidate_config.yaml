# R050 候选：行业池等权 + Swedroe 5/25 阈值带（卫星仓）。
# 把 R038 在核心仓验证成功的"零自适应阈值纪律"移植到 R039/R049 留下的 16 行业池：
# 不做任何行业选择（等权持有全部），唯一差异是"阈值触发 vs 日历触发"。
# 对照基线 domestic_industry_equal_weight.yaml（同池同权重，月频日历调仓），
# 回答"在行业池上，阈值带能否像 R038 那样以更低换手取得同等或更好绩效"。
# 注意：16 资产时目标权重 6.25%，相对带 25%×6.25%=1.56pp 严于绝对带 5pp，
# 触发由相对带主导（R038 的 4 资产是绝对带主导）——参数仍取先验常数，不调。
# 设计见 docs/r050_industry_threshold_blueprint.md。
